name: Refresh space events

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:         # run manually from the Actions tab
  push:
    paths:
      - "data/space-events.json"
      - "scripts/generate_space_events.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the events card
        run: python scripts/generate_space_events.py

      - name: Commit if the card changed
        run: |
          if [[ -n "$(git status --porcelain assets/space-events.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/space-events.svg
            git commit -m "chore: refresh space events"
            git push
          fi
